---
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-build:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Repo
        uses: bitshift-systems/.github/actions/setup-repo@80203ed69d67558f5b74d3419eae9748624fd162 # setup-repo-v1.0.1
        with:
          cache-key: rust-build

      - name: Install missing Rust components
        run: mise run util:rust:components

      - name: Build and archive tests
        run: mise run test:rust:archive:build

      - name: Run doctests
        run: mise run test:rust:docs

      - name: Upload workspace tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-workspace
          path: target/nextest/workspace.tar.zst
          retention-days: 1
          compression-level: 0

  rust-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: rust-build
    name: Rust Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        kind: ['unit']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Repo
        uses: bitshift-systems/.github/actions/setup-repo@80203ed69d67558f5b74d3419eae9748624fd162 # setup-repo-v1.0.1
        with:
          cache-key: rust-test

      - name: Install missing Rust components
        run: mise run util:rust:components

      - name: Download tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-workspace
          path: target/nextest

      - name: Run tests
        run: mise run "test:rust:archive:${{ matrix.kind }}"

  rust-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Repo
        uses: bitshift-systems/.github/actions/setup-repo@80203ed69d67558f5b74d3419eae9748624fd162 # setup-repo-v1.0.1
        with:
          cache-key: rust-lint
      - name: Install missing Rust components
        run: mise run util:rust:components

      - run: mise run lint:rust
      - run: mise run fmt:rust:check

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "jactionlint=$(mise config get tools.jactionlint)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: bitshift-systems/.github/actions/workflow-lint@d0a18edb781c2752fbe2b8f36629a1bc95649548 # workflow-lint-v1.0.0
        with:
          jactionlint-version: ${{ steps.tools.outputs.jactionlint }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - rust-build
      - rust-test
      - rust-lint
      - workflow-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
